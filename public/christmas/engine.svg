<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 200" width="292" height="200">
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .wheel, .puff, .beam { animation: none; } }
    .puff { transform-box: fill-box; transform-origin: center; animation: puff 2.1s ease-out infinite; }
    .p2 { animation-delay: -0.7s; } .p3 { animation-delay: -1.4s; }
    .beam { animation: beam 1.2s ease-in-out infinite alternate; }
    @keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 20% { opacity: 0.95; } 100% { opacity: 0; transform: translate(-62px, -34px) scale(1.9); } }
    @keyframes beam { from { opacity: 0.18; } to { opacity: 0.42; } }
  </style>
  
