  <style>
    .flash { transform-box: fill-box; transform-origin: center; animation: flash 3.6s ease-out infinite; }
    .head { transform-origin: 62px 70px; animation: nod 3.6s ease-in-out infinite; }
    @keyframes flash { 0%, 66% { opacity: 0; transform: scale(0.2); } 70% { opacity: 1; transform: scale(1.15); } 78%, 100% { opacity: 0; transform: scale(1.3); } }
    @keyframes nod { 0%, 50%, 100% { transform: rotate(0); } 64%, 76% { transform: rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { .flash, .head { animation: none; } .flash { opacity: 0; } }
  </style>
